apiVersion: capability-orchestrator.io/v2
kind: Contract
metadata:
  id: llm.complete
  version: "1.0.0"
  status: active

spec:
  capability: llm.complete
  type: worker
  semver:
    major: 1
    minor: 0
    patch: 0
  deterministic: false
  side_effects: false
  requires_confirmation: false
  permissions:
    filesystem: none
    network: true
    shell: false
  timeout: "30s"
  retry_policy:
    max: 2
  cost:
    latency: medium
    token_cost: high
    compute_cost: low
    network_cost: medium
    risk: low
  provider_requirements:
    plugin: observable-inference
  evidence:
    schema: evidence/worker-default@1.0.0
